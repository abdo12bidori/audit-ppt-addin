<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit Capture</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 12px; background: #0f172a; color: #e2e8f0; font-size: 13px; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .status { padding: 8px 10px; background: #1e293b; border-radius: 6px; margin: 8px 0; font-size: 12px; border-left: 3px solid #64748b; }
    .status.ok { border-color: #22c55e; background: #052e16; }
    .status.err { border-color: #ef4444; background: #450a0a; }
    .stats { padding: 8px 10px; background: #1e293b; border-radius: 6px; font-size: 11px; color: #94a3b8; margin-bottom: 8px; }
    .stats span { color: #38bdf8; font-weight: 600; }
    .log { background: #020617; border-radius: 6px; padding: 8px; font-family: ui-monospace, monospace; font-size: 10px; max-height: 240px; overflow-y: auto; margin-top: 8px; color: #94a3b8; }
    .log div { padding: 2px 0; border-bottom: 1px solid #1e293b; }
    .log div.ok { color: #4ade80; }
    .log div.err { color: #f87171; }
    button { width: 100%; padding: 8px; border: 0; background: #2563eb; color: white; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; margin-top: 8px; }
    button:hover { background: #1d4ed8; }
    #measure { background: #7c3aed; }
    #measure:hover { background: #6d28d9; }
    #measure-output {
      background: #020617; color: #cbd5e1; font-size: 10px;
      font-family: ui-monospace, monospace; padding: 8px;
      border-radius: 6px; margin-top: 8px; max-height: 320px;
      overflow: auto; white-space: pre-wrap; word-break: break-all;
      display: none; line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>📸 Audit Capture</h1>
  <div class="status" id="status">En attente de l'extension…</div>

  <!-- Stats bar hidden — refresh was unreliable.
       To re-enable, remove style="display:none;" -->
  <div class="stats" style="display:none;">
    Slide actuelle : <span id="currentSlide">-</span> ·
    Images : <span id="slideImages">0</span> ·
    Total session : <span id="totalImages">0</span>
  </div>

  <button id="reset">Réinitialiser la session</button>

  <!-- ⭐ Bouton "Mesurer les formes" CACHÉ (display:none).
       Le code JS dans taskpane.js reste intact et ne plante pas.
       Pour le réafficher, enlève simplement style="display:none;". -->
  <button id="measure" style="display:none;">📐 Mesurer les formes</button>
  <pre id="measure-output" style="display:none;"></pre>

  <div class="log" id="log"></div>

  <!-- Templates -->
  <script src="templates/street.js?v=6"></script>
  <script src="templates/obione.js?v=6"></script>
  <script src="templates/onb.js?v=6"></script>
  <script src="templates/ban.js?v=6"></script>
  <script src="templates/index.js?v=6"></script>

  <!-- Placement modules (order matters) -->
  <script src="placement/config.js?v=6"></script>
  <script src="placement/image.js?v=6"></script>
  <script src="placement/insert.js?v=6"></script>
  <script src="placement/insert-cdp.js?v=6"></script>
  <script src="placement/paste.js?v=6"></script>
  <script src="placement/slots.js?v=6"></script>
  <script src="placement/position.js?v=6"></script>
  <script src="placement/fast.js?v=6"></script>
  <script src="placement/process.js?v=6"></script>
  <script src="placement/queue.js?v=6"></script>

  <!-- UI -->
  <script src="taskpane.js?v=6"></script>
</body>
</html>
